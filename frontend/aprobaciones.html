<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Aprobaciones pendientes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<style>dialog::backdrop{background:rgb(15 23 42/.5)}</style>
</head>

<body class="min-h-dvh bg-slate-100 text-slate-900 antialiased">

<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-4xl items-center gap-3 px-4 py-3">
    <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-slate-900 text-lg">✅</div>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold">Aprobaciones pendientes</p>
      <p id="cab-rol" class="truncate text-xs text-slate-500">…</p>
    </div>
    <a href="dashboard.html" class="rounded-xl px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Mi panel</a>
    <button id="btn-salir" class="rounded-xl px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Salir</button>
  </div>
</header>

<main class="mx-auto max-w-4xl px-4 py-6 pb-24">
  <div id="lista" class="space-y-3">
    <p class="rounded-2xl bg-white p-5 text-sm text-slate-500 ring-1 ring-slate-200">Cargando…</p>
  </div>
</main>

<dialog id="modal-rechazo" class="w-[min(100vw-1.5rem,30rem)] rounded-2xl p-0">
  <form id="form-rechazo" method="dialog">
    <div class="border-b border-slate-200 px-5 py-4">
      <h2 class="font-semibold">Rechazar solicitud</h2>
      <p id="rechazo-de" class="mt-0.5 text-sm text-slate-500"></p>
    </div>
    <div class="px-5 py-4">
      <label for="motivo" class="block text-sm font-medium text-slate-700">
        Motivo <span class="font-normal text-slate-500">(lo verá el empleado)</span>
      </label>
      <textarea id="motivo" rows="3" maxlength="300" required
                placeholder="Ej.: coincide con el cierre contable del mes"
                class="mt-1.5 w-full resize-none rounded-xl border-0 bg-slate-50 px-3 py-2.5 ring-1 ring-slate-300
                       focus:bg-white focus:ring-2 focus:ring-slate-900"></textarea>
    </div>
    <div class="flex gap-3 border-t border-slate-200 px-5 py-4">
      <button type="button" data-cerrar class="flex-1 rounded-xl bg-slate-100 px-4 py-3 font-medium hover:bg-slate-200">
        Cancelar
      </button>
      <button type="submit" class="flex-1 rounded-xl bg-rose-600 px-4 py-3 font-medium text-white hover:bg-rose-700">
        Confirmar rechazo
      </button>
    </div>
  </form>
</dialog>

<div class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex justify-center px-4">
  <p id="aviso" class="hidden max-w-sm rounded-xl bg-slate-900 px-4 py-3 text-center text-sm text-white shadow-lg"></p>
</div>

<script type="module">
import { api, sesion, fecha, fechaHora, esc } from "./js/api.js";

const $ = (id) => document.getElementById(id);
if (!sesion.vigente) location.replace("index.html");

let pendientes = [];
let temporizador;

function avisar(texto, error = false) {
  const el = $("aviso");
  el.textContent = texto;
  el.className = `max-w-sm rounded-xl px-4 py-3 text-center text-sm shadow-lg ${
    error ? "bg-rose-600 text-white" : "bg-slate-900 text-white"}`;
  clearTimeout(temporizador);
  temporizador = setTimeout(() => el.classList.add("hidden"), 4000);
}

function tarjeta(s) {
  const rango = s.fecha_inicio === s.fecha_fin
    ? fecha(s.fecha_inicio)
    : `${fecha(s.fecha_inicio, false)} – ${fecha(s.fecha_fin)}`;
  const horas = s.hora_inicio ? ` · ${s.hora_inicio} a ${s.hora_fin}` : "";

  const banderas = [];
  if (s.es_adelanto) banderas.push(["amber", "Supera su saldo: días adelantados"]);
  if (s.tipo === "permiso" && !s.adjuntos) banderas.push(["rose", "Sin respaldo adjunto"]);
  if (!s.firmas && s.tipo === "permiso") banderas.push(["rose", "Sin firma del solicitante"]);

  return `
  <article class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold">${esc(s.empleado)}</p>
        <p class="text-sm text-slate-500">${esc(s.cedula)}${s.departamento ? " · " + esc(s.departamento) : ""}</p>
      </div>
      <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700">
        ${s.tipo === "vacacion" ? "🏖️ Vacaciones" : "📄 " + esc(s.categoria || "Permiso")}
      </span>
    </div>

    <dl class="mt-4 grid grid-cols-2 gap-x-4 gap-y-2 text-sm sm:grid-cols-4">
      <div><dt class="text-xs text-slate-500">Fechas</dt><dd class="font-medium">${rango}${horas}</dd></div>
      <div><dt class="text-xs text-slate-500">Días</dt><dd class="font-medium">${s.dias_solicitados}</dd></div>
      <div><dt class="text-xs text-slate-500">Saldo</dt><dd class="font-medium">${s.saldo_actual} días</dd></div>
      <div><dt class="text-xs text-slate-500">Enviada</dt><dd class="font-medium">${fechaHora(s.created_at)}</dd></div>
    </dl>

    <p class="mt-3 text-sm text-slate-700">${esc(s.descripcion)}</p>
    ${s.justificacion
      ? `<p class="mt-2 rounded-xl bg-slate-50 p-3 text-sm text-slate-600">
           <span class="font-medium">Justificación:</span> ${esc(s.justificacion)}</p>` : ""}

    ${banderas.length
      ? `<div class="mt-3 flex flex-wrap gap-2">${banderas.map(([t, texto]) =>
          `<span class="rounded-lg px-2.5 py-1 text-xs font-medium ${
            t === "amber" ? "bg-amber-50 text-amber-800 ring-1 ring-amber-200"
                          : "bg-rose-50 text-rose-800 ring-1 ring-rose-200"}">${esc(texto)}</span>`
        ).join("")}</div>` : ""}

    <div class="mt-4 flex gap-3">
      <button data-rechazar="${s.id}" data-nombre="${esc(s.empleado)}"
              class="flex-1 rounded-xl bg-white px-4 py-2.5 font-medium text-rose-700 ring-1 ring-rose-200 hover:bg-rose-50">
        Rechazar
      </button>
      <button data-aprobar="${s.id}"
              class="flex-1 rounded-xl bg-emerald-600 px-4 py-2.5 font-medium text-white hover:bg-emerald-700">
        Aprobar
      </button>
    </div>
  </article>`;
}

async function cargar() {
  const perfil = sesion.perfil;
  $("cab-rol").textContent = perfil.rol === "jefe"
    ? `${perfil.nombre} · solicitudes de su equipo`
    : `${perfil.nombre} · aprobación final de Talento Humano`;

  try {
    pendientes = await api.pendientes();
  } catch (err) {
    $("lista").innerHTML = `<p class="rounded-2xl bg-white p-5 text-sm text-rose-700 ring-1 ring-rose-200">${esc(err.message)}</p>`;
    return;
  }

  $("lista").innerHTML = pendientes.length
    ? pendientes.map(tarjeta).join("")
    : `<p class="rounded-2xl bg-white p-8 text-center text-sm text-slate-500 ring-1 ring-slate-200">
         No tiene solicitudes pendientes. 🎉</p>`;
}

document.addEventListener("click", async (e) => {
  const aprobar = e.target.closest("[data-aprobar]");
  if (aprobar) {
    aprobar.disabled = true;
    aprobar.textContent = "Aprobando…";
    try {
      const r = await api.decidir(aprobar.dataset.aprobar, "aprobar", null);
      avisar(r.mensaje);
      await cargar();
    } catch (err) {
      avisar(err.message, true);
      await cargar();
    }
    return;
  }

  const rechazar = e.target.closest("[data-rechazar]");
  if (rechazar) {
    $("form-rechazo").dataset.id = rechazar.dataset.rechazar;
    $("rechazo-de").textContent = `Solicitud de ${rechazar.dataset.nombre}`;
    $("motivo").value = "";
    $("modal-rechazo").showModal();
    $("motivo").focus();
    return;
  }

  if (e.target.closest("[data-cerrar]")) e.target.closest("dialog")?.close();
});

$("form-rechazo").addEventListener("submit", async (e) => {
  e.preventDefault();
  const motivo = $("motivo").value.trim();
  if (motivo.length < 5) return $("motivo").focus();
  $("modal-rechazo").close();
  try {
    const r = await api.decidir($("form-rechazo").dataset.id, "rechazar", motivo);
    avisar(r.mensaje);
  } catch (err) {
    avisar(err.message, true);
  }
  await cargar();
});

$("btn-salir").addEventListener("click", async () => {
  try { await api.cerrarSesion(); } catch { /* el token se descarta igual */ }
  sesion.borrar();
  location.href = "index.html";
});

cargar();
</script>
</body>
</html>
