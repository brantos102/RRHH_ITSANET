<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>Revisar solicitud</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="stylesheet" href="vendor/tailwind.css">
<script src="config.js"></script>
</head>

<body class="min-h-dvh bg-slate-100 text-slate-900 antialiased">
<main class="mx-auto max-w-lg px-4 py-8">

  <header class="mb-6 text-center">
    <div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-2xl bg-slate-900 text-xl">🗓️</div>
    <h1 id="titulo" class="text-lg font-semibold">Revisar solicitud</h1>
    <p id="subtitulo" class="mt-1 text-sm text-slate-500">Cargando…</p>
  </header>

  <section id="tarjeta" class="hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
    <dl id="detalle" class="divide-y divide-slate-100"></dl>

    <div id="alertas" class="mt-4 space-y-2"></div>

    <div id="acciones" class="mt-6 space-y-3">
      <button id="btn-aprobar"
              class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-medium text-white
                     hover:bg-emerald-700 disabled:opacity-50">
        Aprobar solicitud
      </button>
      <button id="btn-abrir-rechazo"
              class="w-full rounded-xl bg-white px-4 py-3 font-medium text-rose-700 ring-1 ring-rose-200
                     hover:bg-rose-50">
        Rechazar
      </button>
    </div>

    <form id="form-rechazo" class="mt-4 hidden">
      <label for="motivo" class="block text-sm font-medium text-slate-700">
        Motivo del rechazo <span class="font-normal text-slate-500">(lo verá el empleado)</span>
      </label>
      <textarea id="motivo" rows="3" maxlength="300" required
                placeholder="Ej.: coincide con el cierre contable del mes"
                class="mt-1.5 w-full resize-none rounded-xl border-0 bg-slate-50 px-3 py-2.5 ring-1 ring-slate-300
                       focus:bg-white focus:ring-2 focus:ring-slate-900"></textarea>
      <div class="mt-3 flex gap-3">
        <button type="button" id="btn-cancelar-rechazo"
                class="flex-1 rounded-xl bg-slate-100 px-4 py-3 font-medium hover:bg-slate-200">Volver</button>
        <button type="submit" id="btn-confirmar-rechazo"
                class="flex-1 rounded-xl bg-rose-600 px-4 py-3 font-medium text-white hover:bg-rose-700 disabled:opacity-50">
          Confirmar rechazo
        </button>
      </div>
    </form>
  </section>

  <section id="resultado" class="hidden rounded-2xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
    <p id="resultado-icono" class="text-4xl"></p>
    <h2 id="resultado-titulo" class="mt-3 font-semibold"></h2>
    <p id="resultado-texto" class="mt-2 text-sm text-slate-600"></p>
  </section>

  <p class="mt-6 text-center text-xs leading-relaxed text-slate-400">
    Este enlace es personal y de un solo uso. Si no reconoce esta solicitud, avise a Talento Humano.
  </p>
</main>

<script type="module">
import { api, fecha, esc } from "./js/api.js";

const $ = (id) => document.getElementById(id);
const parametros = new URLSearchParams(location.search);
const token = parametros.get("t");
const rol = parametros.get("r");

function mostrarResultado(icono, titulo, texto) {
  $("tarjeta").classList.add("hidden");
  $("resultado-icono").textContent = icono;
  $("resultado-titulo").textContent = titulo;
  $("resultado-texto").textContent = texto;
  $("resultado").classList.remove("hidden");
}

function fila(etiqueta, valor, destacar = false) {
  return `<div class="flex justify-between gap-4 py-2.5">
    <dt class="shrink-0 text-sm text-slate-500">${esc(etiqueta)}</dt>
    <dd class="text-right text-sm ${destacar ? "font-semibold" : ""}">${esc(valor)}</dd>
  </div>`;
}

async function cargar() {
  if (!token || !["jefe", "rrhh"].includes(rol)) {
    return mostrarResultado("🔗", "Enlace no válido",
      "Revise que copió el enlace completo del correo, o ingrese al sistema.");
  }

  let datos;
  try {
    datos = await api.verEnlace(token, rol);
  } catch (err) {
    return mostrarResultado("🔗", "Enlace no válido o vencido", err.message);
  }

  const s = datos.solicitud;
  $("titulo").textContent = rol === "jefe" ? "Aprobación del jefe inmediato" : "Aprobación de Talento Humano";
  $("subtitulo").textContent = `Solicitud de ${s.empleado}`;

  const rango = s.fecha_inicio === s.fecha_fin
    ? fecha(s.fecha_inicio)
    : `${fecha(s.fecha_inicio, false)} al ${fecha(s.fecha_fin)}`;

  $("detalle").innerHTML =
    fila("Solicitante", `${s.empleado} · ${s.cedula}`) +
    fila("Cargo", [s.cargo, s.departamento].filter(Boolean).join(" · ") || "—") +
    fila("Tipo", s.tipo === "vacacion" ? "Vacaciones" : s.categoria || "Permiso") +
    fila("Fechas", rango, true) +
    (s.hora_inicio ? fila("Horario", `${s.hora_inicio} a ${s.hora_fin}`) : "") +
    fila("Días", String(s.dias_solicitados), true) +
    fila("Saldo del empleado", `${s.saldo_actual} días`) +
    fila("Descripción", s.descripcion) +
    (s.justificacion ? fila("Justificación", s.justificacion) : "") +
    fila("Respaldos", `${s.adjuntos} adjunto(s) · ${s.firmas} firma(s)`);

  const alertas = [];
  if (s.es_adelanto)
    alertas.push(["amber", "Supera el saldo disponible: se tomarán como días adelantados."]);
  if (s.adjuntos === 0 && s.tipo === "permiso")
    alertas.push(["amber", "Esta solicitud no tiene respaldo adjunto."]);
  if (datos.aviso) alertas.push(["slate", datos.aviso]);

  $("alertas").innerHTML = alertas
    .map(([tono, texto]) => `<p class="rounded-xl px-3 py-2.5 text-sm ${
      tono === "amber" ? "bg-amber-50 text-amber-900 ring-1 ring-amber-200" : "bg-slate-50 text-slate-600"
    }">${esc(texto)}</p>`)
    .join("");

  $("tarjeta").classList.remove("hidden");

  if (!datos.puede_decidir) {
    $("acciones").innerHTML =
      `<p class="rounded-xl bg-slate-50 px-4 py-3 text-center text-sm text-slate-600">
         Esta solicitud ya fue resuelta. No hay nada que decidir.</p>`;
  }
}

async function decidir(accion, motivo) {
  const botones = ["btn-aprobar", "btn-abrir-rechazo", "btn-confirmar-rechazo"];
  botones.forEach((b) => ($(b).disabled = true));
  try {
    const r = await api.decidirEnlace(token, rol, accion, motivo);
    if (r.estado === "pendiente_rrhh")
      mostrarResultado("✅", "Aprobada", "Pasó a Talento Humano para la aprobación final.");
    else if (r.estado === "aprobado")
      mostrarResultado("✅", "Aprobada", "Se emitió el código QR y se avisó al empleado por correo.");
    else mostrarResultado("🚫", "Rechazada", "Se avisó al empleado con el motivo que usted indicó.");
  } catch (err) {
    mostrarResultado("⚠️", "No se pudo completar", err.message);
  }
}

$("btn-aprobar").addEventListener("click", () => decidir("aprobar", null));
$("btn-abrir-rechazo").addEventListener("click", () => {
  $("acciones").classList.add("hidden");
  $("form-rechazo").classList.remove("hidden");
  $("motivo").focus();
});
$("btn-cancelar-rechazo").addEventListener("click", () => {
  $("form-rechazo").classList.add("hidden");
  $("acciones").classList.remove("hidden");
});
$("form-rechazo").addEventListener("submit", (e) => {
  e.preventDefault();
  const motivo = $("motivo").value.trim();
  if (motivo.length < 5) return $("motivo").focus();
  decidir("rechazar", motivo);
});

cargar();
</script>
</body>
</html>
